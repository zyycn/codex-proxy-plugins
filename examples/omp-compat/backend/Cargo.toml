[package]
name = "codex-proxy-plugin-omp-compat"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.97"
autotests = false

[[test]]
name = "omp"
path = "tests/main.rs"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "f174320e2ac8987578146d4684e69ad196db0286", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "process"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
needless_collect = { level = "deny", priority = 8 }

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
