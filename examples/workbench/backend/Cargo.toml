[package]
name = "codex-proxy-plugin-workbench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
autotests = false
rust-version = "1.97"

[[test]]
name = "workbench"
path = "tests/main.rs"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "f770ba127d1293bb482921019e61cae7cb3b7de9", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["io-util"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
needless_collect = { level = "deny", priority = 8 }

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
